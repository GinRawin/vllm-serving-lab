<circle cx="672.0" cy="697.2179573405208" r="4.5" fill="#2563eb" stroke="white" stroke-width="1.5"><title>Concurrency 20: Output tokens = 1377.1044 tokens/s</title></circle>
<circle cx="1060.0" cy="678.0443152670042" r="4.5" fill="#2563eb" stroke="white" stroke-width="1.5"><title>Concurrency 30: Output tokens = 1994.2817 tokens/s</title></circle>
