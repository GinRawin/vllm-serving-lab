<line x1="90" y1="142.0" x2="1060" y2="142.0" stroke="#e2e8f0"/>
<text x="78" y="146.0" text-anchor="end" class="tick">450</text>
<line x1="90.0" y1="142" x2="90.0" y2="375" stroke="#e2e8f0" stroke-dasharray="3 5"/>
