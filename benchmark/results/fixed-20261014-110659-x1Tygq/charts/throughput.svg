<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc">
<title id="title">Throughput vs. concurrency</title>
<desc id="desc">Line charts of vLLM benchmark metrics versus configured maximum concurrency. Each marker represents one benchmark run. Lines connect observations only.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#334155} .heading{font-size:23px;font-weight:700} .label{font-size:13px} .tick{font-size:12px;fill:#64748b} .value{font-size:11px;font-weight:600}</style>
<text x="38" y="39" class="heading">Throughput vs. concurrency</text>
<text x="38" y="61" class="tick">Qwen/Qwen3-0.6B | 30 requests per run | All requests succeeded in these runs</text>
<text x="38" y="104" font-size="17" font-weight="600">Successful request throughput</text>
<text x="90" y="129" class="tick">requests/s</text>
<line x1="90" y1="375.0" x2="1060" y2="375.0" stroke="#e2e8f0"/>
<text x="78" y="379.0" text-anchor="end" class="tick">0</text>
<line x1="90" y1="328.4" x2="1060" y2="328.4" stroke="#e2e8f0"/>
