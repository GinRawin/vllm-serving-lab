<line x1="90" y1="188.6" x2="1060" y2="188.6" stroke="#e2e8f0"/>
<text x="78" y="192.6" text-anchor="end" class="tick">6.00</text>
<line x1="90" y1="142.0" x2="1060" y2="142.0" stroke="#e2e8f0"/>
<text x="78" y="146.0" text-anchor="end" class="tick">7.50</text>
<line x1="90.0" y1="142" x2="90.0" y2="375" stroke="#e2e8f0" stroke-dasharray="3 5"/>
<text x="90.0" y="397" text-anchor="middle" class="tick">5</text>
