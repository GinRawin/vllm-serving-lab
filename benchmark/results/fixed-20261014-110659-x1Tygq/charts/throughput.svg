<circle cx="284.0" cy="641.7428643441924" r="4.5" fill="#ea580c" stroke="white" stroke-width="1.5"><title>Concurrency 10: Input + output tokens = 3162.7833 tokens/s</title></circle>
<circle cx="672.0" cy="608.979994355345" r="4.5" fill="#ea580c" stroke="white" stroke-width="1.5"><title>Concurrency 20: Input + output tokens = 4217.3822 tokens/s</title></circle>
<circle cx="1060.0" cy="550.2607155052004" r="4.5" fill="#ea580c" stroke="white" stroke-width="1.5"><title>Concurrency 30: Input + output tokens = 6107.4877 tokens/s</title></circle>
