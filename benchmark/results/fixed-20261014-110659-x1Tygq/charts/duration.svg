<text x="1060.0" y="397" text-anchor="middle" class="tick">30</text>
<text x="575.0" y="424" text-anchor="middle" class="label">Configured maximum concurrency (requests)</text>
<line x1="430" y1="100" x2="453" y2="100" stroke="#2563eb" stroke-width="3"/>
